name: quran_audio
description: "مكتبة تشغيل صوتي للقرآن الكريم - لوجيك فقط بدون UI. تدعم تشغيل السور كاملة والآيات المفردة مع إشعارات الوسائط والتحميل أوفلاين والتكرار."
version: 0.1.0
homepage: https://github.com/alheekmahlib/quran_audio

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  # إدارة الحالة والتخزين / State management & storage
  get: ^4.6.6
  get_storage: ^2.1.1
  # محرك الصوت / Audio engine
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  just_audio_media_kit: ^2.1.0
  # التحميل / Downloads
  dio: ^5.9.2
  # مسارات الملفات / File paths
  path: ^1.9.0
  path_provider: ^2.1.5
  # دمج الـ streams / Stream combination
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/jsons/
    - assets/images/
