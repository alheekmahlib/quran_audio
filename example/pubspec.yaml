name: quran_audio_example
description: "مثال توضيحي لاستخدام مكتبة quran_audio"
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  quran_audio:
    path: ../
  get: ^4.6.6
  get_storage: ^2.1.1
  # للتسميع (تبويب التسميع) — تسجيل الميكروفون وطلب الصلاحية.
  # For recitation (recitation tab) — mic recording + permission requests.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
